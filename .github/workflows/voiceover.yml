name: VoiceOver transcripts (sunhauk.com preview theme)

on:
  workflow_dispatch:
    inputs:
      read_scale:
        description: "Multiplier for the linear read-through length (1 = default per page)"
        default: "1"
        required: false
      theme_id:
        description: "Shopify theme ID rendered with ?preview_theme_id="
        default: "193042743588"
        required: false
      page_set:
        description: "phase1 (5 original pages), phase2 (7 representative pages) or phase2-long (home, 2 products, HSA/FSA)"
        default: "phase1"
        required: false

permissions:
  contents: read

jobs:
  voiceover:
    name: VoiceOver / ${{ matrix.browser }} / ${{ matrix.page }}
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # One macOS runner per page so the five templates run in parallel (VoiceOver allows one session per machine).
      matrix:
        browser: [webkit]
        page: ${{ fromJSON(inputs.page_set == 'phase2' && '["p2-home","p2-product-sunhauk","p2-product-rx","p2-product-accessories","p2-collection","p2-page-hsa-fsa","p2-page-reviews"]' || inputs.page_set == 'phase2-long' && '["p2-home","p2-product-sunhauk","p2-product-rx","p2-page-hsa-fsa"]' || '["home","collections_all-sunglasses","products_gift-card","pages_shipping-delivery","pages_returns-exchanges"]') }}
    env:
      VO_PAGES: ${{ matrix.page }}
      VO_READ_SCALE: ${{ inputs.read_scale }}
      VO_THEME: ${{ inputs.theme_id }}
      RUNNER_OS_LABEL: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Replaces the archived guidepup/setup-action: accessibility permissions in the user TCC.db, AppleScript
      # control of VoiceOver, VoiceOver welcome dialog suppressed, Do Not Disturb on (same as Guidepup's own CI).
      - name: Prepare macOS for VoiceOver automation (3 attempts; Do Not Disturb sometimes fails on fresh runners)
        run: |
          for i in 1 2 3; do npx -y @guidepup/setup@0.29.1 setup --ci && exit 0; echo "setup attempt $i failed"; sleep 10; done
          echo "::warning::guidepup setup did not complete (Do Not Disturb); continuing"

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund --no-progress

      - name: Install Playwright browser
        run: npx playwright install ${{ matrix.browser }}

      - name: Install Guidepup VoiceOver assets
        run: npx -y @guidepup/setup@0.29.1 install

      - name: Make sure no VoiceOver session is already running
        run: |
          osascript -e 'tell application "VoiceOver" to quit' 2>/dev/null || true
          killall VoiceOver 2>/dev/null || true
          sleep 3
          pgrep -l VoiceOver || echo "VoiceOver not running"

      - name: Run the real VoiceOver session and write the transcript
        run: npx playwright test --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voiceover-${{ matrix.browser }}-${{ matrix.page }}
          if-no-files-found: warn
          path: |
            transcripts/**
            test-results/**
            playwright-report/**
